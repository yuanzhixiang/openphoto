[package]
name = "op-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
op-core.workspace = true
op-color.workspace = true
op-io.workspace = true
op-render.workspace = true
op-tools.workspace = true

eframe.workspace = true
egui.workspace = true
egui-phosphor.workspace = true
rfd.workspace = true
log.workspace = true
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
image.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace"] }
raw-window-handle = "0.6"

[dev-dependencies]
image.workspace = true
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
